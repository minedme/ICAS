# 统一文件存储路径配置
file:
  storage:
    path: D:\\Code\\java\\Maven\\ICAS4\\storage

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/DB表?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowPublicKeyRetrieval=true
    username: root     //DBname
    password:          //DB密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never 
      schema-locations: classpath:init.sql
      continue-on-error: true
  mvc:
    view:
      prefix: /
      suffix: .jsp
    format:
      date-time: yyyy-MM-dd'T'HH:mm
      date: yyyy-MM-dd
      time: HH:mm:ss
  session:
    timeout: 3600
    store-type: none

# uniCloud云函数配置
unicloud:
  # 正确的UniCloud云函数调用URL格式：https://<appid>.bspapp.com
  # 请在HBuilderX中查看项目的uniCloud应用ID并替换下面的<appid>
  base-url: 
  
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  type-aliases-package: com.example.demo.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    org.springframework.web: DEBUG
    org.apache.ibatis: DEBUG
    com.example.demo: DEBUG
